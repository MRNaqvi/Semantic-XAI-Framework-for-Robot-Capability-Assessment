<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">S-XAI Framework Flow for Robot Capability and Suitability Assessment</title>
  <desc id="desc">System overview showing user task input, neural prediction, semantic knowledge graph update, MACS Datalog reasoning, and explanation outputs.</desc>
  <defs>
    <style>
      .bg { fill: #f5f8fb; }
      .title { fill: #102033; font: 800 34px Arial, sans-serif; }
      .subtitle { fill: #4b5d72; font: 600 18px Arial, sans-serif; }
      .lane-title { fill: #102033; font: 800 20px Arial, sans-serif; }
      .box-title { fill: #102033; font: 800 19px Arial, sans-serif; }
      .box-text { fill: #314155; font: 600 15px Arial, sans-serif; }
      .small-text { fill: #4b5d72; font: 600 13px Arial, sans-serif; }
      .tiny-text { fill: #5f7186; font: 600 12px Arial, sans-serif; }
      .pill-text { fill: #102033; font: 800 13px Arial, sans-serif; }
      .lane { fill: #ffffff; stroke: #d5e1ed; stroke-width: 2; }
      .user { fill: #d9f3fb; stroke: #2f9af4; stroke-width: 3; }
      .neural { fill: #e9f8ee; stroke: #3bb273; stroke-width: 3; }
      .semantic { fill: #fff5d6; stroke: #e0a92e; stroke-width: 3; }
      .macs { fill: #f5e9ff; stroke: #8f63d8; stroke-width: 3; }
      .explain { fill: #ffe8ef; stroke: #dc5c7b; stroke-width: 3; }
      .system { fill: #eaf0ff; stroke: #5e77d8; stroke-width: 3; }
      .arrow { stroke: #314155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #71839a; stroke-width: 2.4; fill: none; marker-end: url(#smallArrow); stroke-dasharray: 7 6; }
      .section-label { fill: #ffffff; font: 800 14px Arial, sans-serif; }
      .tag { fill: #ffffff; stroke-width: 0; }
      .tag-text { fill: #102033; font: 800 12px Arial, sans-serif; }
      .shadow { filter: url(#shadow); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#23415f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#314155"/>
    </marker>
    <marker id="smallArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71839a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="950"/>

  <text class="title" x="80" y="70">S-XAI Framework Flow for Robot Capability and Suitability Assessment</text>
  <text class="subtitle" x="80" y="103">How the neural models, Robot Capability Ontology, MACS Datalog rules, RDFox reasoning, and explanations work together</text>

  <rect class="lane shadow" x="55" y="145" width="1490" height="650" rx="24"/>
  <rect x="80" y="175" width="145" height="34" rx="17" fill="#22324a"/>
  <text class="section-label" x="105" y="198">Main pipeline</text>

  <!-- User input -->
  <g class="shadow">
    <rect class="user" x="95" y="275" width="215" height="175" rx="18"/>
    <text class="box-title" x="125" y="315">User task input</text>
    <text class="box-text" x="125" y="350">New manufacturing</text>
    <text class="box-text" x="125" y="373">task point</text>
    <rect x="125" y="395" width="135" height="32" rx="16" fill="#ffffff"/>
    <text class="pill-text" x="150" y="416">X, Y, Z</text>
    <text class="tiny-text" x="125" y="470">Roll, pitch, yaw are not used</text>
    <text class="tiny-text" x="125" y="488">for repeatability and precision</text>
  </g>

  <!-- Neural layer -->
  <g class="shadow">
    <rect class="neural" x="385" y="220" width="270" height="285" rx="18"/>
    <text class="lane-title" x="415" y="260">Neural part</text>
    <text class="box-text" x="415" y="295">Flask prediction service</text>
    <text class="box-text" x="415" y="318">loads Keras models</text>
    <rect x="415" y="345" width="205" height="34" rx="17" fill="#ffffff"/>
    <text class="tag-text" x="440" y="367">Ned-2 model</text>
    <rect x="415" y="388" width="205" height="34" rx="17" fill="#ffffff"/>
    <text class="tag-text" x="440" y="410">ABB IRB 1200 model</text>
    <rect x="415" y="431" width="205" height="34" rx="17" fill="#ffffff"/>
    <text class="tag-text" x="440" y="453">ABB IRB 2400 model</text>
    <text class="small-text" x="415" y="492">Output per robot:</text>
    <text class="small-text" x="415" y="512">repeatability + precision</text>
  </g>

  <!-- Semantic KG -->
  <g class="shadow">
    <rect class="semantic" x="735" y="220" width="285" height="285" rx="18"/>
    <text class="lane-title" x="765" y="260">Semantic part</text>
    <text class="box-text" x="765" y="295">RDFox Knowledge Graph</text>
    <text class="box-text" x="765" y="318">with RCO ontology and</text>
    <text class="box-text" x="765" y="341">robot instances</text>
    <rect x="765" y="370" width="220" height="42" rx="12" fill="#ffffff"/>
    <text class="tag-text" x="790" y="395">RCO:has_Measurement_Value</text>
    <text class="small-text" x="765" y="445">Predicted or simulated values</text>
    <text class="small-text" x="765" y="465">replace the old KG values</text>
    <text class="tiny-text" x="765" y="492">Ontology stays stable; instances update</text>
  </g>

  <!-- MACS / reasoning -->
  <g class="shadow">
    <rect class="macs" x="1100" y="220" width="305" height="285" rx="18"/>
    <text class="lane-title" x="1130" y="260">MACS reasoning part</text>
    <text class="box-text" x="1130" y="295">Manufacturing commonsense</text>
    <text class="box-text" x="1130" y="318">Datalog rules compare</text>
    <text class="box-text" x="1130" y="341">capability values</text>
    <rect x="1130" y="370" width="225" height="34" rx="17" fill="#ffffff"/>
    <text class="tag-text" x="1152" y="392">min repeatability</text>
    <rect x="1130" y="412" width="225" height="34" rx="17" fill="#ffffff"/>
    <text class="tag-text" x="1152" y="434">max precision</text>
    <text class="small-text" x="1130" y="480">RDFox derives suitability facts</text>
  </g>

  <!-- Reasoned facts -->
  <g class="shadow">
    <rect class="system" x="1115" y="570" width="275" height="145" rx="18"/>
    <text class="box-title" x="1145" y="610">Reasoned facts</text>
    <text class="box-text" x="1145" y="642">BestSuitableDueTo...</text>
    <text class="box-text" x="1145" y="668">LeastSuitableDueTo...</text>
    <text class="box-text" x="1145" y="694">OptimalRobot</text>
  </g>

  <!-- Explanation layer -->
  <g class="shadow">
    <rect class="explain" x="560" y="570" width="470" height="145" rx="18"/>
    <text class="lane-title" x="590" y="610">Explanation layer</text>
    <text class="box-text" x="590" y="642">Graph and fact views show the KG reasoning path</text>
    <text class="box-text" x="590" y="668">XAI methods explain NN sensitivity over X, Y, Z</text>
    <text class="box-text" x="590" y="694">Natural language explains the selected reasoned fact</text>
  </g>

  <!-- Counterfactual loop -->
  <g class="shadow">
    <rect class="system" x="95" y="570" width="340" height="145" rx="18"/>
    <text class="box-title" x="125" y="610">Simulation and counterfactuals</text>
    <text class="box-text" x="125" y="642">User can replace predicted values</text>
    <text class="box-text" x="125" y="668">with hypothetical capability values</text>
    <text class="box-text" x="125" y="694">and run the KG reasoning again</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M 310 362 C 335 362, 350 362, 380 362"/>
  <path class="arrow" d="M 655 362 C 690 362, 705 362, 730 362"/>
  <path class="arrow" d="M 1020 362 C 1055 362, 1070 362, 1095 362"/>
  <path class="arrow" d="M 1252 505 L 1252 565"/>
  <path class="arrow" d="M 1115 642 C 1080 642, 1060 642, 1035 642"/>
  <path class="soft-arrow" d="M 560 642 C 500 642, 475 642, 440 642"/>
  <path class="soft-arrow" d="M 265 570 C 250 520, 275 480, 360 430"/>
  <path class="soft-arrow" d="M 435 642 C 520 730, 845 760, 1130 690"/>

  <!-- Implementation strip -->
  <rect class="lane shadow" x="80" y="820" width="1440" height="82" rx="18"/>
  <text class="lane-title" x="115" y="855">Implementation services</text>
  <rect x="365" y="835" width="180" height="38" rx="19" fill="#d9f3fb" stroke="#2f9af4" stroke-width="2"/>
  <text class="tag-text" x="405" y="859">Web UI</text>
  <rect x="575" y="835" width="210" height="38" rx="19" fill="#e9f8ee" stroke="#3bb273" stroke-width="2"/>
  <text class="tag-text" x="615" y="859">Flask + Keras</text>
  <rect x="815" y="835" width="210" height="38" rx="19" fill="#eaf0ff" stroke="#5e77d8" stroke-width="2"/>
  <text class="tag-text" x="855" y="859">.NET API</text>
  <rect x="1055" y="835" width="210" height="38" rx="19" fill="#fff5d6" stroke="#e0a92e" stroke-width="2"/>
  <text class="tag-text" x="1102" y="859">RDFox 7.5b</text>
  <rect x="1295" y="835" width="175" height="38" rx="19" fill="#ffe8ef" stroke="#dc5c7b" stroke-width="2"/>
  <text class="tag-text" x="1322" y="859">OpenAI/Ollama</text>

  <text class="tiny-text" x="115" y="890">The same selected fact can be explained through graph, facts, NN XAI, natural language, and simulated/counterfactual comparison.</text>
</svg>
